<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" role="img" aria-label="Hearth architecture">
  <defs>
    <linearGradient id="panel" x1="90" y1="50" x2="680" y2="570" gradientUnits="userSpaceOnUse">
      <stop stop-color="#211b16"/>
      <stop offset="1" stop-color="#120f0c"/>
    </linearGradient>
    <linearGradient id="flame" x1="310" y1="166" x2="452" y2="352" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffc27d"/>
      <stop offset=".5" stop-color="#e87945"/>
      <stop offset="1" stop-color="#a93b1b"/>
    </linearGradient>
    <linearGradient id="line" x1="120" y1="0" x2="650" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e87945" stop-opacity="0"/>
      <stop offset=".5" stop-color="#e87945" stop-opacity=".8"/>
      <stop offset="1" stop-color="#e87945" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#ec7f4a" stop-opacity=".3"/>
      <stop offset=".55" stop-color="#ec7f4a" stop-opacity=".07"/>
      <stop offset="1" stop-color="#ec7f4a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="#f3d9c1" stroke-opacity=".035"/>
    </pattern>
    <filter id="blur">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect x="34" y="24" width="692" height="572" rx="34" fill="url(#panel)" stroke="#3b2e23"/>
  <rect x="34" y="24" width="692" height="572" rx="34" fill="url(#grid)"/>
  <circle cx="380" cy="300" r="220" fill="url(#glow)"/>

  <g opacity=".7">
    <circle cx="128" cy="118" r="2.2" fill="#f0c28d"/>
    <circle cx="636" cy="170" r="2" fill="#f0c28d"/>
    <circle cx="614" cy="472" r="2.6" fill="#e87945"/>
    <circle cx="154" cy="430" r="1.8" fill="#9fb38c"/>
    <circle cx="550" cy="96" r="1.5" fill="#f0c28d"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
    <text x="78" y="76" fill="#8d7c6c" font-size="10" letter-spacing="2.4">HEARTH / SYSTEM MAP</text>
    <text x="682" y="76" text-anchor="end" fill="#e87945" font-size="10" letter-spacing="1.8">v3.2</text>

    <g opacity=".95">
      <rect x="84" y="112" width="592" height="66" rx="14" fill="#1b1612" stroke="#473529"/>
      <text x="110" y="139" fill="#7d6d5e" font-size="9" letter-spacing="1.8">01 / EXPERIENCE</text>
      <text x="110" y="159" fill="#e8d9c6" font-size="14">Task cards · approvals · artifacts · takeover</text>
      <circle cx="646" cy="145" r="4" fill="#e87945"/>
    </g>

    <path d="M380 178v20" stroke="url(#line)" stroke-width="1.3"/>
    <path d="m375 193 5 7 5-7" fill="none" stroke="#e87945" stroke-width="1.2"/>

    <g opacity=".95">
      <rect x="84" y="208" width="286" height="122" rx="16" fill="#1b1612" stroke="#473529"/>
      <text x="108" y="237" fill="#7d6d5e" font-size="9" letter-spacing="1.7">02 / CONTROL</text>
      <text x="108" y="262" fill="#e8d9c6" font-size="16">Personal Gateway</text>
      <text x="108" y="282" fill="#9e8e7e" font-size="11">identity · channels · devices</text>
      <path d="M108 304h190" stroke="#473529" stroke-dasharray="3 4"/>
    </g>

    <g opacity=".95">
      <rect x="390" y="208" width="286" height="122" rx="16" fill="#1b1612" stroke="#473529"/>
      <text x="414" y="237" fill="#7d6d5e" font-size="9" letter-spacing="1.7">03 / AUTHORITY</text>
      <text x="414" y="262" fill="#e8d9c6" font-size="16">Policy · Mandate</text>
      <text x="414" y="282" fill="#9e8e7e" font-size="11">risk · budget · approvals</text>
      <path d="M414 304h188" stroke="#473529" stroke-dasharray="3 4"/>
    </g>

    <path d="M227 330v18h306v-18" fill="none" stroke="#473529"/>
    <path d="M380 348v18" stroke="url(#line)" stroke-width="1.3"/>
    <path d="m375 361 5 7 5-7" fill="none" stroke="#e87945" stroke-width="1.2"/>

    <g opacity=".95">
      <rect x="84" y="376" width="592" height="78" rx="16" fill="#1b1612" stroke="#473529"/>
      <text x="108" y="404" fill="#7d6d5e" font-size="9" letter-spacing="1.7">04 / DURABLE HARNESS</text>
      <text x="108" y="428" fill="#e8d9c6" font-size="14">Event Log · task graph · leases · recovery</text>
      <g fill="none" stroke="#e87945" stroke-opacity=".55">
        <path d="M514 416h122"/>
        <circle cx="532" cy="416" r="3" fill="#e87945" stroke="none"/>
        <circle cx="568" cy="416" r="3" fill="#e87945" stroke="none"/>
        <circle cx="604" cy="416" r="3" fill="#e87945" stroke="none"/>
      </g>
    </g>

    <path d="M380 454v18" stroke="url(#line)" stroke-width="1.3"/>
    <path d="m375 467 5 7 5-7" fill="none" stroke="#e87945" stroke-width="1.2"/>

    <g opacity=".95">
      <rect x="84" y="482" width="592" height="78" rx="16" fill="#1b1612" stroke="#473529"/>
      <text x="108" y="510" fill="#7d6d5e" font-size="9" letter-spacing="1.7">05 / EXECUTORS</text>
      <text x="108" y="534" fill="#e8d9c6" font-size="14">Codex · Native · Connector · Browser · GUI · Human</text>
      <circle cx="646" cy="521" r="4" fill="#9fb38c"/>
    </g>
  </g>

  <g transform="translate(380 300)">
    <circle r="92" fill="url(#glow)" filter="url(#blur)"/>
    <circle r="88" fill="#171310" stroke="#4d3a2c"/>
    <circle r="72" fill="#1e1813" stroke="#35291f"/>
    <path d="M0-48c6 15 21 21 21 40C21 9 12 22 0 22S-21 9-21-8c0-19 15-25 21-40Z" fill="url(#flame)"/>
    <path d="M0-23c4 8 11 12 11 22C11 8 6 16 0 16S-11 8-11-1c0-10 7-14 11-22Z" fill="#ffe1b4" opacity=".92"/>
    <circle r="5" cy="46" fill="#e87945"/>
    <path d="M-60 55h120" stroke="#6d5140" stroke-linecap="round"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#9e8e7e" font-size="9" letter-spacing="1.4">
    <text x="78" y="590">EVENT LOG / ARTIFACTS / RECEIPTS</text>
    <text x="682" y="590" text-anchor="end" fill="#e87945">LOCAL-FIRST</text>
  </g>
</svg>
