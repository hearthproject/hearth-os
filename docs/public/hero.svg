    <g opacity=".96">
      <rect x="390" y="208" width="286" height="122" rx="16" fill="#fbfdff" stroke="#cfe5f1"/>
      <text x="414" y="237" fill="#6f8fa2" font-size="9" letter-spacing="1.7">03 / AUTHORITY</text>
      <text x="414" y="262" fill="#173042" font-size="16">Policy · Mandate</text>
      <text x="414" y="282" fill="#5b7586" font-size="11">risk · budget · approvals</text>
      <path d="M414 304h188" stroke="#d7e8f2" stroke-dasharray="3 4"/>
    </g>

    <path d="M227 330v18h306v-18" fill="none" stroke="#c7dce8"/>
    <path d="M380 348v18" stroke="url(#line)" stroke-width="1.3"/>
    <path d="m375 361 5 7 5-7" fill="none" stroke="#4b9cc4" stroke-width="1.2"/>

    <g opacity=".96">
      <rect x="84" y="376" width="592" height="78" rx="16" fill="#fbfdff" stroke="#cfe5f1"/>
      <text x="108" y="404" fill="#6f8fa2" font-size="9" letter-spacing="1.7">04 / DURABLE HARNESS</text>
      <text x="108" y="428" fill="#173042" font-size="14">Event Log · task graph · leases · recovery</text>
      <g fill="none" stroke="#4b9cc4" stroke-opacity=".55">
        <path d="M514 416h122"/>
        <circle cx="532" cy="416" r="3" fill="#4b9cc4" stroke="none"/>
        <circle cx="568" cy="416" r="3" fill="#4b9cc4" stroke="none"/>
        <circle cx="604" cy="416" r="3" fill="#4b9cc4" stroke="none"/>
      </g>
    </g>

    <path d="M380 454v18" stroke="url(#line)" stroke-width="1.3"/>
    <path d="m375 467 5 7 5-7" fill="none" stroke="#4b9cc4" stroke-width="1.2"/>

    <g opacity=".96">
      <rect x="84" y="482" width="592" height="78" rx="16" fill="#fbfdff" stroke="#cfe5f1"/>
      <text x="108" y="510" fill="#6f8fa2" font-size="9" letter-spacing="1.7">05 / EXECUTORS</text>
      <text x="108" y="534" fill="#173042" font-size="14">Codex · Native · Connector · Browser · GUI · Human</text>
