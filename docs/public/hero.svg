    <path d="M0-48c6 15 21 21 21 40C21 9 12 22 0 22S-21 9-21-8c0-19 15-25 21-40Z" fill="url(#flame)"/>
    <path d="M0-23c4 8 11 12 11 22C11 8 6 16 0 16S-11 8-11-1c0-10 7-14 11-22Z" fill="#f4fdff" opacity=".95"/>
    <circle r="5" cy="46" fill="#4b9cc4"/>
    <path d="M-60 55h120" stroke="#9ac9dd" stroke-linecap="round"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#6f8fa2" font-size="9" letter-spacing="1.4">
    <text x="78" y="590">EVENT LOG / ARTIFACTS / RECEIPTS</text>
    <text x="682" y="590" text-anchor="end" fill="#2f7fa8">READ · BUILD · VERIFY</text>
  </g>
