<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" role="img" aria-label="Hearth documentation map">
  <defs>
    <linearGradient id="panel" x1="90" y1="50" x2="680" y2="570" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e7f4fb"/>
    </linearGradient>
    <linearGradient id="flame" x1="310" y1="166" x2="452" y2="352" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a7e6f5"/>
      <stop offset=".5" stop-color="#4b9cc4"/>
      <stop offset="1" stop-color="#1f6285"/>
    </linearGradient>
    <linearGradient id="line" x1="120" y1="0" x2="650" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4b9cc4" stop-opacity="0"/>
      <stop offset=".5" stop-color="#4b9cc4" stop-opacity=".72"/>
      <stop offset="1" stop-color="#4b9cc4" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#79c9e4" stop-opacity=".32"/>
      <stop offset=".55" stop-color="#79c9e4" stop-opacity=".08"/>
      <stop offset="1" stop-color="#79c9e4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="#2f7fa8" stroke-opacity=".055"/>
    </pattern>
    <filter id="blur">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect x="34" y="24" width="692" height="572" rx="34" fill="url(#panel)" stroke="#c7e1ef"/>
  <rect x="34" y="24" width="692" height="572" rx="34" fill="url(#grid)"/>
  <circle cx="380" cy="300" r="220" fill="url(#glow)"/>

  <g opacity=".75">
    <circle cx="128" cy="118" r="2.2" fill="#73b9d5"/>
    <circle cx="636" cy="170" r="2" fill="#73b9d5"/>
    <circle cx="614" cy="472" r="2.6" fill="#4b9cc4"/>
    <circle cx="154" cy="430" r="1.8" fill="#8ac8de"/>
    <circle cx="550" cy="96" r="1.5" fill="#73b9d5"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
    <text x="78" y="76" fill="#6f8fa2" font-size="10" letter-spacing="2.4">HEARTH / DOCUMENTATION MAP</text>
    <text x="682" y="76" text-anchor="end" fill="#2f7fa8" font-size="10" letter-spacing="1.8">LOCAL-FIRST</text>

    <g opacity=".96">
      <rect x="84" y="112" width="592" height="66" rx="14" fill="#fbfdff" stroke="#cfe5f1"/>
      <text x="110" y="139" fill="#6f8fa2" font-size="9" letter-spacing="1.8">01 / EXPERIENCE</text>
      <text x="110" y="159" fill="#173042" font-size="14">Task cards · approvals · artifacts · takeover</text>
      <circle cx="646" cy="145" r="4" fill="#4b9cc4"/>
