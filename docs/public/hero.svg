    <path d="M380 178v20" stroke="url(#line)" stroke-width="1.3"/>
    <path d="m375 193 5 7 5-7" fill="none" stroke="#4b9cc4" stroke-width="1.2"/>

    <g opacity=".96">
      <rect x="84" y="208" width="286" height="122" rx="16" fill="#fbfdff" stroke="#cfe5f1"/>
      <text x="108" y="237" fill="#6f8fa2" font-size="9" letter-spacing="1.7">02 / CONTROL</text>
      <text x="108" y="262" fill="#173042" font-size="16">Personal Gateway</text>
      <text x="108" y="282" fill="#5b7586" font-size="11">identity · channels · devices</text>
      <path d="M108 304h190" stroke="#d7e8f2" stroke-dasharray="3 4"/>
