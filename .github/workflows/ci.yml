name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  verify:
    name: Typecheck, test, build and docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck 2>&1 | tee typecheck.log

      - name: Test
        run: npm test 2>&1 | tee test.log

      - name: Build web
        run: npm run build 2>&1 | tee build.log

      - name: Build docs
        run: npm run docs:build 2>&1 | tee docs-build.log

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: "*.log"
          if-no-files-found: ignore
          retention-days: 7
