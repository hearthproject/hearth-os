[package]
name = "hearth_desktop"
version = "0.1.0"
description = "Hearth desktop shell"
authors = ["Hearth"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "hearth_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12.6", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
