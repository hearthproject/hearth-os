[package]
name = "hearth_desktop"
version = "0.7.0"
description = "Hearth desktop shell"
authors = ["Hearth"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "hearth_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[features]
default = []
updater = ["dep:tauri-plugin-updater"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12.6", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = { version = "2", optional = true }
rfd = "0.15"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
