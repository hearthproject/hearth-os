appId: ai.hearth.os
productName: Hearth
electronVersion: 45.3.4
asar: true
publish: null
directories:
  output: ../../release
  buildResources: build
files:
  - dist/**
  - package.json
extraResources:
  - from: resources/web
    to: web
    filter:
      - "**/*"
  - from: resources/server
    to: server
    filter:
      - "**/*"
      - "!**/node_modules/**"
  - from: resources/server/node_modules
    to: server/node_modules
    filter:
      - "**/*"
  - from: resources/tray.png
    to: tray.png
win:
  icon: build/icon.ico
  signExecutable: false
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  artifactName: "Hearth-Setup-${version}.${ext}"
  include: build/installer.nsh
portable:
  artifactName: "Hearth-Portable-${version}.${ext}"
  unpackDirName: "HearthPortable"
npmRebuild: false
