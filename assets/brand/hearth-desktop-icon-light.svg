<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="hearth-desktop-icon-light-title hearth-desktop-icon-light-desc">
  <title id="hearth-desktop-icon-light-title">Hearth desktop app icon, light variant</title>
  <desc id="hearth-desktop-icon-light-desc">The Hearth arch in warm charcoal and the ember in ember orange, on a sand-gradient squircle tile.</desc>

  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#FFFAF2"/>
      <stop offset="0.55" stop-color="#F8E8D6"/>
      <stop offset="1" stop-color="#EFD2B4"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0.6" x2="0" y2="1">
      <stop offset="0" stop-color="#C08A5E" stop-opacity="0"/>
      <stop offset="1" stop-color="#C08A5E" stop-opacity="0.16"/>
    </linearGradient>
    <clipPath id="tileclip">
      <rect x="32" y="32" width="960" height="960" rx="214"/>
    </clipPath>
  </defs>

  <rect x="32" y="32" width="960" height="960" rx="214" fill="url(#tile)"/>
  <g clip-path="url(#tileclip)">
    <rect x="32" y="32" width="960" height="960" fill="url(#sheen)"/>
    <rect x="32" y="32" width="960" height="960" fill="url(#base)"/>
    <rect x="33" y="33" width="958" height="958" rx="213" fill="none" stroke="#C99C74" stroke-width="3" stroke-opacity="0.28"/>
  </g>

  <g transform="translate(158.7 138) scale(2.76)">
    <path d="M62 206V126a66 66 0 0 1 132 0v80" fill="none" stroke="#241E19" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M128 92c15 21 30 40 30 60 0 19-13 32-30 32s-30-13-30-32c0-16 10-31 23-48 1 13 6 22 15 27 2-13-1-26-8-39Z" fill="#F26B38"/>
  </g>
</svg>
