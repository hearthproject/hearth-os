<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="760" viewBox="0 0 1700 760" font-family="'Microsoft YaHei UI','Microsoft YaHei','PingFang SC','Noto Sans SC','Segoe UI',sans-serif">
<rect width="1700" height="760" fill="#F4F7FB"/>
<rect x="0" y="0" width="1700" height="7" fill="#2563EB"/>
<text x="64" y="72" font-size="30" font-weight="700" fill="#172033">一次任务的完整路径</text>
<text x="64" y="104" font-size="15" fill="#74829A">从一句目标到可核对的完成证据</text>
<rect x="44" y="150" width="1612" height="190" rx="18" fill="#FFFFFF" stroke="#DDE5F0" stroke-width="1.2"/>
<text x="66" y="178" font-size="12" font-family="'Cascadia Mono','Consolas','SFMono-Regular',monospace" fill="#74829A">request path</text>
<rect x="64" y="196" width="206" height="128" rx="14" fill="#EAF1FE" stroke="#2563EB" stroke-width="1.4"/>
<text x="82" y="226" font-size="15" font-weight="700" fill="#172033">1 说目标</text>

<text x="82" y="258" font-size="12.5" fill="#42506A">自然语言或附件</text>
<line x1="270" y1="260" x2="300" y2="260" stroke="#74829A" stroke-width="1.6"/>
<polyline points="293,255 300,260 293,265" fill="none" stroke="#74829A" stroke-width="1.6"/>
<rect x="300" y="196" width="206" height="128" rx="14" fill="#F0EDFC" stroke="#6C5BD4" stroke-width="1.4"/>
<text x="318" y="226" font-size="15" font-weight="700" fill="#172033">2 定边界</text>

<text x="318" y="258" font-size="12.5" fill="#42506A">目标契约 / 完成判定</text>
<line x1="506" y1="260" x2="536" y2="260" stroke="#74829A" stroke-width="1.6"/>
<polyline points="529,255 536,260 529,265" fill="none" stroke="#74829A" stroke-width="1.6"/>
<rect x="536" y="196" width="206" height="128" rx="14" fill="#E4F5F4" stroke="#0E8587" stroke-width="1.4"/>
<text x="554" y="226" font-size="15" font-weight="700" fill="#172033">3 选执行</text>

<text x="554" y="258" font-size="12.5" fill="#42506A">general / coding / browser</text>
<line x1="742" y1="260" x2="772" y2="260" stroke="#74829A" stroke-width="1.6"/>
<polyline points="765,255 772,260 765,265" fill="none" stroke="#74829A" stroke-width="1.6"/>
<rect x="772" y="196" width="206" height="128" rx="14" fill="#FCF0DF" stroke="#B4680B" stroke-width="1.4"/>
<text x="790" y="226" font-size="15" font-weight="700" fill="#172033">4 审批</text>

<text x="790" y="258" font-size="12.5" fill="#42506A">workspace 自动可逆</text>
<text x="790" y="279" font-size="12.5" fill="#42506A">外部动作逐次确认</text>
<line x1="978" y1="260" x2="1008" y2="260" stroke="#74829A" stroke-width="1.6"/>
<polyline points="1001,255 1008,260 1001,265" fill="none" stroke="#74829A" stroke-width="1.6"/>
<rect x="1008" y="196" width="206" height="128" rx="14" fill="#EAF1FE" stroke="#2563EB" stroke-width="1.4"/>
<text x="1026" y="226" font-size="15" font-weight="700" fill="#172033">5 动手</text>

<text x="1026" y="258" font-size="12.5" fill="#42506A">工具 / 子代理 / 测试</text>
<line x1="1214" y1="260" x2="1244" y2="260" stroke="#74829A" stroke-width="1.6"/>
<polyline points="1237,255 1244,260 1237,265" fill="none" stroke="#74829A" stroke-width="1.6"/>
<rect x="1244" y="196" width="206" height="128" rx="14" fill="#E6F4EC" stroke="#18794E" stroke-width="1.4"/>
<text x="1262" y="226" font-size="15" font-weight="700" fill="#172033">6 验证</text>

<text x="1262" y="258" font-size="12.5" fill="#42506A">测试 / 断言 / diff</text>
<line x1="1450" y1="260" x2="1480" y2="260" stroke="#74829A" stroke-width="1.6"/>
<polyline points="1473,255 1480,260 1473,265" fill="none" stroke="#74829A" stroke-width="1.6"/>
<rect x="1480" y="196" width="206" height="128" rx="14" fill="#F0EDFC" stroke="#6C5BD4" stroke-width="1.4"/>
<text x="1498" y="226" font-size="15" font-weight="700" fill="#172033">7 报告</text>

<text x="1498" y="258" font-size="12.5" fill="#42506A">证据 / 回执 / 可回退</text>
<rect x="44" y="370" width="1612" height="190" rx="18" fill="#FFFFFF" stroke="#DDE5F0" stroke-width="1.2"/>
<text x="66" y="398" font-size="12" font-family="'Cascadia Mono','Consolas','SFMono-Regular',monospace" fill="#74829A">trust boundary</text>
<rect x="64" y="414" width="370" height="128" rx="14" fill="#E4F5F4" stroke="#0E8587" stroke-width="1.4"/>
<text x="82" y="444" font-size="15" font-weight="700" fill="#172033">页面快照</text>

<text x="82" y="476" font-size="12.5" fill="#42506A">稳定元素 ID</text>
<text x="82" y="497" font-size="12.5" fill="#42506A">密码值不返回</text>
<line x1="434" y1="478" x2="474" y2="478" stroke="#74829A" stroke-width="1.6"/>
<polyline points="467,473 474,478 467,483" fill="none" stroke="#74829A" stroke-width="1.6"/>
<rect x="474" y="414" width="370" height="128" rx="14" fill="#FCF0DF" stroke="#B4680B" stroke-width="1.4"/>
<text x="492" y="444" font-size="15" font-weight="700" fill="#172033">动作审批</text>

<text x="492" y="476" font-size="12.5" fill="#42506A">风险等级</text>
<text x="492" y="497" font-size="12.5" fill="#42506A">参数指纹 / 域名授权</text>
<line x1="844" y1="478" x2="884" y2="478" stroke="#74829A" stroke-width="1.6"/>
<polyline points="877,473 884,478 877,483" fill="none" stroke="#74829A" stroke-width="1.6"/>
<rect x="884" y="414" width="370" height="128" rx="14" fill="#E6F4EC" stroke="#18794E" stroke-width="1.4"/>
<text x="902" y="444" font-size="15" font-weight="700" fill="#172033">效果账本</text>

<text x="902" y="476" font-size="12.5" fill="#42506A">执行前记录</text>
<text x="902" y="497" font-size="12.5" fill="#42506A">执行后对账</text>
<line x1="1254" y1="478" x2="1294" y2="478" stroke="#74829A" stroke-width="1.6"/>
<polyline points="1287,473 1294,478 1287,483" fill="none" stroke="#74829A" stroke-width="1.6"/>
<rect x="1294" y="414" width="370" height="128" rx="14" fill="#EAF1FE" stroke="#2563EB" stroke-width="1.4"/>
<text x="1312" y="444" font-size="15" font-weight="700" fill="#172033">逐轮历史</text>

<text x="1312" y="476" font-size="12.5" fill="#42506A">文件快照</text>
<text x="1312" y="497" font-size="12.5" fill="#42506A">回退漂移保护</text>
<text x="64" y="630" font-size="13" fill="#42506A">失败时：保留失败原因和证据，任务进入 recoverable；修复后重试，不覆盖历史。</text>
<text x="64" y="726" font-size="11" fill="#74829A">执行层可替换，审批与证据层不能绕过。</text>
</svg>